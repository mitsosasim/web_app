<title id="title">Pet Care application architecture</title><desc id="desc">HTML forms exchange JSON with Java servlets. Servlets use JDBC table helpers and six relational tables. The local demo uses Tomcat and H2. The optional external assistant is not part of the verified demo.</desc>
